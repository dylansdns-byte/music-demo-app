<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossfade</title>
  <style>
    :root {
      --bg-dark: #121212;
      --panel-dark: #1e1e1e;
      --text-main: #ffffff;
      --text-dim: #b3b3b3;
      --accent: #1db954;
      --error: #ff4d4d;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .auth-modal {
      background: var(--panel-dark);
      border-radius: 12px;
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2, h3 { margin-top: 0; }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-dim);
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #252525;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:hover { opacity: 0.9; }
    .signup-secondary-btn {
      background: #333;
    }
    .auth-error {
      color: var(--error);
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <!-- ======================================================== -->
  <!--               CROSSFADE FRONTEND RENDERING TREE          -->
  <!-- ======================================================== -->
  <script>
    const createEl = (tag, attrs, children) => {
      const el = document.createElement(tag);
      for (let k in attrs) {
        if (k.startsWith('on')) el[k] = attrs[k];
        else el.setAttribute(k, attrs[k]);
      }
      if (children) {
        if (Array.isArray(children)) {
          children.forEach(c => c && el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
        } else {
          el.appendChild(typeof children === 'string' ? document.createTextNode(children) : children);
        }
      }
      return el;
    };

    const div = (a, c) => createEl('div', a, c);
    const h2 = (a, c) => createEl('h2', a, c);
    const h3 = (a, c) => createEl('h3', a, c);
    const label = (a, c) => createEl('label', a, c);
    const input = (a, c) => createEl('input', a, c);
    const button = (a, c) => createEl('button', a, c);

    class CrossfadeApp {
      constructor(parent) {
        this.parent = parent;
        this.state = {
          authName: "Crossfade Hub",
          authEmail: "",
          authPass: "",
          authErr: "",
          currentModal: "login", 
          activeUser: null
        };
        this.render();
      }

      setState(newState) {
        this.state = { ...this.state, ...newState };
        this.render();
      }

      render() {
        this.parent.innerHTML = "";
        
        if (this.state.activeUser) {
          this.parent.appendChild(
            div({}, [
              h2({}, "Welcome to Crossfade"),
              div({}, "Status: Connected to Backend Infrastructure Services"),
              div({}, "Profile ID: " + this.state.activeUser),
              button({
                onclick: () => this.setState({ activeUser: null, currentModal: "login" })
              }, "Sign Out")
            ])
          );
          return;
        }

        if (this.state.currentModal === "login") {
          this.parent.appendChild(
            div({ class: "auth-modal" }, [
              h3({}, "Log in with your " + this.state.authName + " account to continue."),
              
              div({ class: "input-group" }, [
                label({}, "Email"),
                input({
                  value: this.state.authEmail,
                  oninput: (e) => this.setState({ authEmail: e.target.value })
                })
              ]),

              div({ class: "input-group" }, [
                label({}, "Password"),
                input({
                  type: "password",
                  value: this.state.authPass,
                  oninput: (e) => this.setState({ authPass: e.target.value })
                })
              ]),

              this.state.authErr ? div({ class: "auth-error" }, this.state.authErr) : null,

              button({
                onclick: () => {
                  const email = this.state.authEmail;
                  const password = this.state.authPass;
                  this.setState({ authErr: "" });

                  window.processFirebaseLogin(email, password)
                    .then(user => {
                      if (user) {
                        this.setState({ currentModal: null, activeUser: user.uid });
                      }
                    })
                    .catch(err => {
                      this.setState({ authErr: err.message });
                    });
                }
              }, "Log in"),

              button({
                class: "signup-secondary-btn",
                onclick: () => {
                  const email = this.state.authEmail;
                  const password = this.state.authPass;
                  this.setState({ authErr: "" });

                  window.processFirebaseSignUp(email, password)
                    .then(user => {
                      if (user) {
                        this.setState({ currentModal: null, activeUser: user.uid });
                      }
                    })
                    .catch(err => {
                      this.setState({ authErr: err.message });
                    });
                }
              }, "Create Account")
            ])
          );
        }
      }
    }

    const appElement = document.getElementById("app") || document.body;
    new CrossfadeApp(appElement);
  </script>

  <!-- ======================================================== -->
  <!--               FIREBASE APPLICATION CONTEXT MODULE        -->
  <!-- ======================================================== -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAnalytics } from "https://gstatic.com";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyA_Or5DNQh0zCg9hLhntgDLw32LcCEnPM0",
      authDomain: "://firebaseapp.com",
      projectId: "linkedmusic-e7c84",
      storageBucket: "linkedmusic-e7c84.firebasestorage.app",
      messagingSenderId: "680556166614",
      appId: "1:680556166614:web:b51a333ea7485a0b76b877",
      measurementId: "G-DFESYCFD5Q"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    window.processFirebaseLogin = async (email, password) => {
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        console.log("Logged into Firebase successfully!", userCredential.user);
        alert("Success! Authenticated profile ID: " + userCredential.user.uid);
        return userCredential.user;
      } catch (error) {
        console.error("Firebase Login Error:", error.message);
        throw error; 
      }
    };

    window.processFirebaseSignUp = async (email, password) => {
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        console.log("Created Firebase user successfully!", userCredential.user);
        alert("Account created! Registered ID: " + userCredential.user.uid);
        return userCredential.user;
      } catch (error) {
        console.error("Firebase Sign-Up Error:", error.message);
        throw error;
      }
    };
  </script>
</body>
</html>
